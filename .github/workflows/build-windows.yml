name: Build Windows Exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build frontend
      shell: bash
      run: |
        cd frontend
        npm install
        npm run build

    - name: Build exe (注入构建号 + PyInstaller)
      # 必须跑 build.py 而非直接 pyinstaller:前者会先 write_build_info 注入 git commit + 构建时间,
      # 否则前端版本号显示 "(dev)",无法对齐同事机器跑的是哪个构建
      run: python build.py --skip-npm --skip-iss

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LocalAgent-win64
        path: dist/LocalAgent/
        retention-days: 30
